<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mahlingo Sentence Mahjong</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="title">Mahlingo</div>
      <div class="subtitle">Sentence Mahjong</div>
    </div>

    <div class="controls">
      <div class="control">
        <label for="mode">Mode</label>
        <select id="mode">
          <option value="EN">English (ESL)</option>
          <option value="ES">Spanish</option>
        </select>
      </div>

      <div class="control">
        <label for="level">Level</label>
        <select id="level">
          <option value="EASY">Easy</option>
          <option value="MED">Medium</option>
          <option value="HARD">Hard</option>
        </select>
      </div>

      <button id="newGameBtn" class="btn primary">New Game</button>
      <button id="hintBtn" class="btn">Hint</button>
      <button id="undoBtn" class="btn">Undo</button>
      <button id="clearTrayBtn" class="btn danger">Clear Tray</button>
    </div>
  </header>

  <main class="layout">
    <section class="left">
      <div class="panel">
        <div class="panel-title">Build a sentence to clear tiles</div>

        <div class="stats">
          <div class="stat"><span class="label">Time</span><span id="time">0:00</span></div>
          <div class="stat"><span class="label">Sentences</span><span id="sentences">0</span></div>
          <div class="stat"><span class="label">Goal</span><span id="goal">8</span></div>
        </div>

        <div class="template-wrap">
          <div class="template-title">Template</div>
          <div id="template" class="template"></div>
        </div>

        <div class="tray-wrap">
          <div class="tray-title">Sentence Tray (tap tiles below)</div>
          <div id="tray" class="tray" aria-label="Sentence tray"></div>
          <div class="tray-actions">
            <button id="checkBtn" class="btn primary">Check Sentence</button>
          </div>
          <div id="message" class="message" role="status" aria-live="polite"></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Colour key</div>
        <div class="legend" id="legend"></div>
      </div>
    </section>

    <section class="right">
      <div class="board-header">
        <div class="board-title">Board</div>
        <div class="board-help" id="boardHelp"></div>
      </div>
      <div id="board" class="board" aria-label="Tile board"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
