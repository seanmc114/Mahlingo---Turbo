<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mahlingo Tiles</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">🀄</div>
        <div>
          <h1>Mahlingo Tiles</h1>
          <p class="sub">Build correct sentences by tapping tiles</p>
        </div>
      </div>

      <div class="controls">
        <label class="select">
          <span>Language</span>
          <select id="langSelect">
            <option value="en">English (EN)</option>
            <option value="es" selected>Spanish (ES)</option>
            <option value="de">German (DE)</option>
          </select>
        </label>

        <label class="select">
          <span>Difficulty</span>
          <select id="diffSelect">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </label>

        <button id="startBtn" class="btn primary">Start / Reset</button>
      </div>
    </header>

    <main class="main">
      <section class="panel prompt">
        <h2>Prompt</h2>
        <div class="promptRow">
          <div class="pill" id="promptLabel">Goal</div>
          <div id="promptText" class="promptText">Press Start</div>
        </div>
        <div class="metaRow">
          <div class="meta" id="ruleHint"></div>
          <div class="score">
            <span>Score:</span> <strong id="score">0</strong>
          </div>
        </div>
      </section>

      <section class="panel build">
        <h2>Your sentence</h2>
        <div id="sentenceBar" class="sentenceBar" aria-label="sentence"></div>

        <div class="actions">
          <button id="undoBtn" class="btn">Undo</button>
          <button id="clearBtn" class="btn">Clear</button>
          <button id="shuffleBtn" class="btn">Shuffle tiles</button>
          <button id="checkBtn" class="btn success">Check</button>
        </div>

        <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
      </section>

      <section class="panel tiles">
        <h2>Tiles</h2>
        <div id="tileGrid" class="tileGrid" aria-label="tiles"></div>
      </section>
    </main>

    <footer class="footer">
      <div class="legend">
        <span class="key k-pron">Pronoun</span>
        <span class="key k-verb">Verb</span>
        <span class="key k-det">Det</span>
        <span class="key k-noun">Noun</span>
        <span class="key k-prep">Prep</span>
        <span class="key k-other">Other</span>
      </div>
      <div class="tiny">Tip: Spanish can drop the subject (“voy…”). English & German usually can’t.</div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
